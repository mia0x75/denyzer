name: Release

on:
  push:
    tags:
      - v*

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write

jobs:
  build:
    name: Build Linux, Windows and BSD releases
    runs-on: ubuntu-latest
    if: github.repository_owner == 'mia0x75'
    env:
      # Selects the build group in .goreleaser.yml. The macOS binaries are
      # built by the darwin job below, on a macOS runner.
      DENYZER_TARGET: cross
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
        id: go

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # The query log is stored in SQLite through the native driver
      # (github.com/mattn/go-sqlite3), so every release binary has to be
      # built with CGO. Zig bundles a libc for every platform we cross
      # compile to, and scripts/zigcc/cc-zig.sh maps the Go target onto the
      # matching Zig target triple.
      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0

      - name: Build
        run: make build

      - name: Test
        run: make test

      - name: Docker meta
        id: docker_meta
        uses: crazy-max/ghaction-docker-meta@v6
        with:
          images: ghcr.io/mia0x75/denyzer

      # The image is compiled on the target platform, because the SQLite
      # driver needs the target's C toolchain. The non-native platforms are
      # therefore emulated.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.CR_PAT }}

      - name: Populate build variables
        id: get_vars
        shell: bash
        run: |
          VERSION=$(git describe --always --tags)
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "VERSION: ${VERSION}"

          BUILD_TIME=$(date --iso-8601=seconds)
          echo "build_time=${BUILD_TIME}" >> $GITHUB_OUTPUT
          echo "BUILD_TIME: ${BUILD_TIME}"

          DOC_PATH=${VERSION%%-*}
          echo "doc_path=${DOC_PATH}" >> $GITHUB_OUTPUT
          echo "DOC_PATH: ${DOC_PATH}"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm/v6,linux/arm/v7,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.docker_meta.outputs.tags }}
          labels: ${{ steps.docker_meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.get_vars.outputs.version }}
            BUILD_TIME=${{ steps.get_vars.outputs.build_time }}
            DOC_PATH=${{ steps.get_vars.outputs.doc_path }}

      # Creates the draft release and uploads every non-macOS asset plus the
      # checksum file. The macOS assets are added by the darwin job.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # cgo invokes the compiler from its own build directory, so the
          # wrapper has to be referenced by an absolute path.
          CC: ${{ github.workspace }}/scripts/zigcc/cc-zig.sh

      # The binaries are handed to the test job below, which runs the SQLite
      # smoke test on every target.
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: dist_cross
          path: dist
          retention-days: 1

  darwin:
    name: Build macOS releases
    runs-on: macos-latest
    needs: build
    if: github.repository_owner == 'mia0x75'
    env:
      DENYZER_TARGET: darwin
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      # The dashboard is embedded into the binary and the exported files are
      # gitignored, so every runner that compiles a release binary has to
      # build them.
      - name: Build dashboard
        run: make dashboard

      # Go's darwin runtime always links against the macOS system libraries
      # (-lresolv and the res_9_* symbols of /usr/lib/libresolv.9.dylib),
      # which no cross compiler can provide. The macOS binaries are therefore
      # built here, on a real macOS host, with the native compiler.
      #
      # The publish step is skipped: the release itself is created by the
      # Linux job, and the archives are uploaded to it below.
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload macOS archives
        shell: bash
        run: |
          gh release upload "$TAG" dist/*.tar.gz --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

      # The checksum file of the Linux job only covers the non-macOS assets,
      # so the two files are merged into one and the result replaces the
      # uploaded one.
      - name: Merge checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p merged
          gh release download "$TAG" --pattern "denyzer_checksums.txt" --dir merged --repo "$GITHUB_REPOSITORY"
          cat merged/denyzer_checksums.txt dist/denyzer_checksums.txt | sort -k 2 > merged/denyzer_checksums.merged
          mv merged/denyzer_checksums.merged merged/denyzer_checksums.txt
          gh release upload "$TAG" merged/denyzer_checksums.txt --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

      # The binaries are handed to the test job below, which runs the SQLite
      # smoke test on every target.
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: dist_macos
          path: dist
          retention-days: 1

  test:
    name: Test ${{ matrix.target }}
    needs:
      - build
      - darwin
    runs-on: ${{ matrix.runner }}
    if: github.repository_owner == 'mia0x75'
    permissions:
      contents: read
      # The run-on-arch action caches its emulator images in the package
      # registry.
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux/amd64
            os: linux
            arch: amd64
            runner: ubuntu-latest
            distdir: dist_cross
            bindir: cross_linux_amd64_v1
            binary: denyzer
          - target: linux/arm64
            os: linux
            arch: aarch64
            runner: ubuntu-latest
            distdir: dist_cross
            bindir: cross_linux_arm64_v8.0
            binary: denyzer
          - target: linux/arm/v6
            os: linux
            arch: armv6
            runner: ubuntu-latest
            distdir: dist_cross
            bindir: cross_linux_arm_6
            binary: denyzer
          - target: linux/arm/v7
            os: linux
            arch: armv7
            runner: ubuntu-latest
            distdir: dist_cross
            bindir: cross_linux_arm_7
            binary: denyzer
          - target: windows/amd64
            os: windows
            arch: amd64
            runner: windows-latest
            distdir: dist_cross
            bindir: cross_windows_amd64_v1
            binary: denyzer.exe
          - target: darwin/amd64
            os: darwin
            arch: amd64
            runner: macos-26-intel
            distdir: dist_macos
            bindir: macos_darwin_amd64_v1
            binary: denyzer
          - target: darwin/arm64
            os: darwin
            arch: arm64
            runner: macos-latest
            distdir: dist_macos
            bindir: macos_darwin_arm64_v8.0
            binary: denyzer

    steps:
      # The smoke test script is part of the repository and is mounted into the
      # emulator containers, so it has to be checked out here.
      - name: Checkout
        uses: actions/checkout@v7

      # The binaries of the two build jobs are downloaded into separate
      # directories, because both dist folders contain files with the same
      # names (artifacts.json, metadata.json, ...).
      - name: Download cross binaries
        uses: actions/download-artifact@v8
        with:
          name: dist_cross
          # Inside the workspace, because that is the only directory the
          # emulator containers get mounted to.
          path: ${{ github.workspace }}/dist_cross

      - name: Download macOS binaries
        uses: actions/download-artifact@v8
        with:
          name: dist_macos
          path: ${{ github.workspace }}/dist_macos

      # Artifacts do not carry the executable bit. The file is made
      # executable on the host, which the emulator containers see as well,
      # because the workspace is mounted into them.
      - name: Enable execution
        if: matrix.os != 'windows'
        shell: bash
        run: |
          chmod +x "${{ github.workspace }}/${{ matrix.distdir }}/${{ matrix.bindir }}/${{ matrix.binary }}"

      # The smoke test proves that the binary really writes to SQLite: it
      # starts the server, resolves a name that is answered from the custom
      # DNS mapping and reads the entry back through the API.
      - name: Run smoke test
        if: matrix.os != 'linux' || matrix.arch == 'amd64'
        shell: bash
        run: |
          bash "${{ github.workspace }}/scripts/smoke-test.sh" \
            "${{ github.workspace }}/${{ matrix.distdir }}/${{ matrix.bindir }}/${{ matrix.binary }}"

      # The ARM binaries are run under QEMU. The images are Debian based, so
      # curl is installed for the smoke test.
      - name: Run smoke test under QEMU
        if: matrix.os == 'linux' && matrix.arch != 'amd64'
        uses: uraimo/run-on-arch-action@v3
        with:
          arch: ${{ matrix.arch }}
          distro: bookworm
          githubToken: ${{ github.token }}
          install: |
            if ! command -v curl >/dev/null 2>&1; then
              apt-get update
              apt-get install -y --no-install-recommends curl
            fi
          run: |
            bash "${{ github.workspace }}/scripts/smoke-test.sh" \
              "${{ github.workspace }}/${{ matrix.distdir }}/${{ matrix.bindir }}/${{ matrix.binary }}"
