name: docs

on:
  push:
    tags:
      - v*

    branches:
      - '**'
    paths:
      - .github/workflows/**
      - mkdocs.yml
      - docs/**

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.has_pages && (github.repository_owner != 'mia0x75' || github.ref_type == 'tag' || github.ref_name == 'main') }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: install tools
        run: pip install mkdocs-material mike

      - name: Setup doc deploy
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

      - name: Deploy documentation
        run: |
          VERSION=docs
          if [[ ${{github.ref}} =~ ^refs/tags/ ]]; then
            EXTRA_ALIAS=latest
          fi
          mike deploy --update-aliases "$VERSION" $EXTRA_ALIAS
          # Keep the generated tree, but publish it without commit parents.
          SNAPSHOT=$(git commit-tree "refs/heads/gh-pages^{tree}" -m "Deploy documentation")
          git update-ref refs/heads/gh-pages "$SNAPSHOT"
          test "$(git rev-list --count refs/heads/gh-pages)" -eq 1
          git push --force-with-lease origin refs/heads/gh-pages:refs/heads/gh-pages
          tr '[:upper:]' '[:lower:]' <<< "https://${{github.repository_owner}}.github.io/${{github.event.repository.name}}/" >> "$GITHUB_STEP_SUMMARY"
