name: docs

on:
  workflow_dispatch:
  push:
    tags:
      - v*

    branches:
      - '**'
    paths:
      - .github/workflows/**
      - mkdocs.yml
      - docs/**

concurrency:
  group: ${{ github.workflow }}

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event.repository.has_pages && (github.repository_owner != 'mia0x75' || github.ref_type == 'tag' || github.ref_name == 'main') }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v6

      - uses: actions/setup-python@v7
        with:
          python-version: 3.x

      - name: install tools
        run: pip install mkdocs-material

      - name: Build documentation
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}/
        run: |
          mkdocs build --strict
          # Keep the old versioned URLs as aliases of the current documentation.
          cp -a site "$RUNNER_TEMP/docs-site"
          for alias in docs latest main; do
            cp -a "$RUNNER_TEMP/docs-site" "site/$alias"
            test -s "site/$alias/index.html"
          done

      - name: Upload documentation
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v5
