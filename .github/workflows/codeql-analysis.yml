name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "33 15 * * 1"

# The analysis results are uploaded to GitHub code scanning, which needs the
# security-events permission. Without an explicit permissions block the
# workflow inherits the repository defaults, which are often read-only, and
# the upload step fails with "Resource not accessible by integration".
permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # Pull requests from forks run with a read-only GITHUB_TOKEN, so the SARIF
    # upload is denied there. Code scanning still runs for pushes to main,
    # scheduled runs and pull requests from branches of this repository.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Golang
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go

      - name: Build with Makefile
        run: make build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
